name: Build and release ZIP

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build dependencies
        run: brew install cmake libomp rust
      - name: Build, test and package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=0.1.1
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
          fi
          export BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          bash Scripts/build-release.sh "$version" 2>&1 | tee build-release.log
      - name: Save installable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: OpenSuperWhisper-macOS-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-release.log
            build/launch-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: OpenSuperWhisper-macOS-arm64
          path: dist
      - name: Verify downloaded archive
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Upload into a draft first, so users never see a half-published release.
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              echo "Release already published; keeping its existing assets."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "OpenSuperWhisper ${TAG#v}" --notes-file docs/release-notes.md
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest
